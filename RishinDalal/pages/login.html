<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - The Jersey Adda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/navbar.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>My <span class="highlight">Account</span></h1>
    </header>
    <main class="auth-main">
        <div class="auth-container">
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to access your account</p>
                
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn auth-btn">Sign In</button>
                
                <p class="auth-switch">
                    Don't have an account? <a href="#" id="show-signup">Sign up here</a>
                </p>
            </form>

            <!-- Signup Form (Hidden by default) -->
            <form id="signup-form" class="auth-form hidden">
                <h2>Create Account</h2>
                <p class="auth-subtitle">Join The Jersey Adda today</p>
                
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Cristiano Ronaldo" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" placeholder="cr7@example.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                </div>
                
                <button type="submit" class="btn auth-btn">Create Account</button>
                
                <p class="auth-switch">
                    Already have an account? <a href="#" id="show-login">Sign in here</a>
                </p>
            </form>

        </div>
    </main>
</body>
</html>
