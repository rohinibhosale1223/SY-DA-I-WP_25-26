<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - The Jersey Adda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <script src="../js/navbar.js" defer></script>
    <script src="../js/checkout.js" defer></script>
</head>
<body>
    <header class="page-header">
        <h1>Secure <span class="highlight">Checkout</span></h1>
    </header>
    <main class="checkout-main">
        <form id="checkout-form" class="checkout-container">
            <!-- Left Side: Delivery Address -->
            <div class="checkout-left">
                <h2>1. Delivery Address</h2>
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="address">Street Address</label>
                        <input type="text" id="address" placeholder="123 Football Lane" required>
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" placeholder="New York" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State/Province</label>
                        <input type="text" id="state" placeholder="NY" required>
                    </div>
                    <div class="form-group">
                        <label for="zip">Zip / Postal Code</label>
                        <input type="text" id="zip" placeholder="10001" required>
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" placeholder="United States" required>
                    </div>
                </div>
            </div>

            <!-- Right Side: Payment Form -->
            <div class="checkout-right">
                <h2>2. Payment Details</h2>
                <div class="form-grid payment-grid">
                    <div class="form-group full-width">
                        <label for="cardName">Name on Card</label>
                        <input type="text" id="cardName" placeholder="JOHN DOE" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19" required>
                    </div>
                    <div class="form-group">
                        <label for="expDate">Expiry Date</label>
                        <input type="text" id="expDate" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                    </div>
                </div>
                
                <div class="checkout-actions">
                    <p class="secure-badge">🔒 Secure 256-bit SSL Encryption</p>
                    <button type="submit" class="btn pay-btn">Pay Now & Complete Order</button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
