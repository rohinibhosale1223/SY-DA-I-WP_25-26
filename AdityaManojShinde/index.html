<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoefy - Home</title>
    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/product.css">

</head>

<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main id="content">
        <section id="hero">
            <div class="hero-content">
                <h1>Welcome to Shoefy</h1>
                <p>Step into style with our premium collection of footwear.</p>
                <button class="cta-btn">Shop Now</button>
            </div>
            <div class="hero-image">
                <img src="./images/hero_shoe_splash.png" alt="Hero Image">
            </div>
        </section>
        <section id="featured-products">
            <h2>Featured Products</h2>
            <div class="products-grid">
                <!-- Products will be rendered here by JS -->
            </div>
        </section>
    </main>
    <footer id="footer">
        <div id="logo">Shoefy</div>
        <div>All rights reserved</div>
    </footer>
    <script src="./js/api.js"></script>
    <script src="./js/index.js"></script>
    <script src="./js/product_grid.js"></script>
</body>

</html>
