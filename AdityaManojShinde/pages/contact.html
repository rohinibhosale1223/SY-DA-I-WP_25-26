<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoefy - Home</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/contact.css">

</head>

<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main id="content">
        <div class="contact-page-wrapper">
            <h1 class="page-title">Contact Us</h1>
            <p class="page-subtitle">We'd love to hear from you. Please fill out this form or visit us.</p>
            
            <div class="contact-layout">
                <div class="contact-form-container">
                    <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
                        <div class="input-group">
                            <label for="contact-name">Name</label>
                            <input type="text" id="contact-name" placeholder="Your Name" required>
                        </div>
                        <div class="input-group">
                            <label for="contact-email">Email</label>
                            <input type="email" id="contact-email" placeholder="Your Email" required>
                        </div>
                        <div class="input-group">
                            <label for="contact-subject">Subject</label>
                            <input type="text" id="contact-subject" placeholder="Subject" required>
                        </div>
                        <div class="input-group">
                            <label for="contact-message">Message</label>
                            <textarea id="contact-message" rows="5" placeholder="Your Message" required></textarea>
                        </div>
                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>
                
                <div class="contact-map-container">
                    <div class="contact-info">
                        <h3>Our Store</h3>
                        <p>123 Shoe Avenue<br>New York, NY 10001<br>Email: hello@shoefy.com<br>Phone: +1 234 567 8900</p>
                    </div>
                    <div class="map-wrapper">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3022.215502758117!2d-73.9878201242637!3d40.75716503485743!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25855c6480299%3A0x55194ec5a1ae072e!2sTimes%20Square!5e0!3m2!1sen!2sus!4v1700000000000!5m2!1sen!2sus" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="footer">
        <div id="logo">Shoefy</div>
        <div>All rights reserved</div>
    </footer>
    <script src="../js/api.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
