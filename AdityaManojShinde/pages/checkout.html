<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoefy - Checkout</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>
    <main id="content">
        <form id="checkout-form">
            <div class="checkout-container">
                <!-- Left Column: Delivery -->
                <div class="checkout-section">
                    <h2>Delivery Details</h2>
                    <div class="form-group">
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="address">Street Address</label>
                        <input type="text" id="address" required placeholder="123 Shoe Street">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City</label>
                            <input type="text" id="city" required placeholder="New York">
                        </div>
                        <div class="form-group">
                            <label for="zip">ZIP Code</label>
                            <input type="text" id="zip" required placeholder="10001">
                        </div>
                    </div>

                    <div class="order-summary">
                        <h3>Total to Pay: <span class="total-amount" id="checkout-total">$0.00</span></h3>
                    </div>
                </div>

                <!-- Right Column: Payment -->
                <div class="checkout-section">
                    <h2>Payment Information</h2>
                    <div class="form-group">
                        <label for="card-name">Name on Card</label>
                        <input type="text" id="card-name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="card-number">Card Number</label>
                        <input type="text" id="card-number" required placeholder="0000 0000 0000 0000" maxlength="19">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry (MM/YY)</label>
                            <input type="text" id="expiry" required placeholder="12/25" maxlength="5">
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" required placeholder="123" maxlength="3">
                        </div>
                    </div>
                    <button type="submit" class="pay-btn">Complete Payment</button>
                </div>
            </div>
        </form>
    </main>
    <footer id="footer">
        <div id="logo">Shoefy</div>
        <div>All rights reserved</div>
    </footer>
    <script src="../js/api.js"></script>
    <script src="../js/index.js"></script>
    <script src="../js/checkout.js"></script>
</body>
</html>
