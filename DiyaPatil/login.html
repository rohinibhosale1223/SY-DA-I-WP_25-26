<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aura Fragrances | Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Member Login</h1>
        <nav><a href="index.html">HOME</a> | <a href="register.html">REGISTER</a></nav>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            
            <form action="login.php" method="POST">
                <div class="input-group">
                    <label for="login_email">Email Address:</label>
                    <input type="email" id="login_email" name="email" placeholder="e.g., test@aura.com" required>
                </div>
                
                <div class="input-group">
                    <label for="login_password">Password:</label>
                    <input type="password" id="login_password" name="password" placeholder="e.g., perfume123" required>
                </div>
                
                <button type="submit" class="auth-btn">SIGN IN</button>
            </form>
            
            <p class="auth-link">New to Aura? <a href="register.html">Create an account</a>.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Aura Fragrances.</p>
    </footer>
</body>
</html>
