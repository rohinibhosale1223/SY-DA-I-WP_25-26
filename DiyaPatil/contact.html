<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aura Fragrances | Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Get in Touch</h1>
        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT US</a>
        </nav>
    </header>

    <main class="auth-main">
        <div class="auth-card">
            <h2>Send us a Message</h2>
            <form action="#" method="POST">
                <div class="input-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                
                <div class="input-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="input-group">
                    <label for="message">Your Message:</label>
                    <textarea id="message" name="message" rows="5" placeholder="How can our fragrance experts assist you?" style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit;" required></textarea>
                </div>
                
                <button type="submit" class="auth-btn">SUBMIT INQUIRY</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Aura Fragrances.</p>
    </footer>
</body>
</html>
